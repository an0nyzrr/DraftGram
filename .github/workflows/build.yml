name: Build Draftgram

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK, NDK and build-tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build afat debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: draftgram-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
