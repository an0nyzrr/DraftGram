name: Build Draftgram

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules shallow
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK, NDK and build-tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: native-${{ runner.os }}-arm64-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-arm64-${{ hashFiles('.gitmodules') }}-

      - name: Inject Telegram API credentials
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          BV=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_APP_ID" ] && [ -n "$TG_APP_HASH" ]; then
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = ${TG_APP_ID};/" "$BV"
            sed -i "s/public static String APP_HASH = \"[0-9a-f]*\";/public static String APP_HASH = \"${TG_APP_HASH}\";/" "$BV"
          else
            echo "::warning::TG_APP_ID or TG_APP_HASH secret is missing, the upstream api_id is used and may be flood-blocked"
          fi

      - name: Build afat debug APK (arm64 only)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -PdgAbi=arm64-v8a --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: draftgram-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
